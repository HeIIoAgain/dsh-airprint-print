      # - name: Render smoke test (no paper, no network)
      #   if: runner.os == 'Linux'
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y fonts-noto-cjk
      #     python scripts/airprint.py test-page --host 192.168.1.50 --dry-run --out /tmp/page.png
